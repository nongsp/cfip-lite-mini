name: build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test, vet and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: gofmt
        run: |
          test -z "$(gofmt -l .)"

      - name: go vet
        run: |
          go vet ./...

      - name: go test
        run: |
          go test -v ./...

      - name: go build
        run: |
          go build ./...

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          GOOS=linux   GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/cfip-lite-mini-linux-amd64 .
          GOOS=linux   GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/cfip-lite-mini-linux-arm64 .
          GOOS=linux   GOARCH=arm   GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/cfip-lite-mini-linux-armv7 .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/cfip-lite-mini-windows-amd64.exe .

      - name: Generate checksums
        run: |
          cd dist && sha256sum * > checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
