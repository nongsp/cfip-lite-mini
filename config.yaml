# 目标域名：既用作 TLS SNI，也用作 HTTP Host（默认 ipv4.svi.cc.cd）
domain: ipv4.svi.cc.cd

# IP 来源：支持 CIDR、单 IP、起止范围，可混合多条
ip_range:
  - 43.198.0.0/16
  - 159.60.146.10-159.60.146.200
  - 43.198.5.166

# HTTPS 端口
port: 443

# 单个 IP 从请求开始到 HTTP 响应返回的整个生命周期超时
timeout: 300ms

# 并发 worker 数量
concurrency: 500

# 输出 top 个最佳 IP
top: 30

# 最大扫描 IP 数量（绝对上限 10000000）
max_ips: 1000000

# 请求 User-Agent
user_agent: cfip-lite-mini/1.0

# 使用 yx-tools 风格的 HTTPing 测速方法（每 IP 独立连接、RST 关闭、阻止重定向）。
# 默认开启；如需关闭请设为 false
http: true

# 启用 http 时每个 IP 的测速请求次数，延迟取平均值
ping_times: 1
